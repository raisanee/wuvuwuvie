<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To My Favorite Person</title>

<style>

body{
margin:0;
background:#0b0b14;
font-family:Georgia, serif;
color:white;
overflow-x:hidden;
}

/* 🌙 estrelas */
.stars{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(white 1px, transparent 1px);
background-size:50px 50px;
opacity:0.08;
pointer-events:none;
}

/* 🎵 player menor e mais delicado */
.music-player{
position:fixed;
top:10px;
left:10px;
z-index:999;

display:flex;
align-items:center;
gap:6px;

padding:6px 10px;
border-radius:16px;

background:rgba(255,255,255,0.08);
backdrop-filter: blur(8px);

font-size:11px;
color:white;
}

.music-player span{
opacity:0.8;
font-style:italic;
}

/* deixa o player menor */
.music-player audio{
height:24px;
width:110px;
}

/* 📖 páginas */
section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* 🖼 imagens */
img{
max-width:90%;
border-radius:12px;
box-shadow:0 0 30px rgba(255,255,255,0.15);

opacity:0;
transform:translateY(50px);
transition:all 1s ease;
}

/* aparece no scroll */
img.show{
opacity:1;
transform:translateY(0);
}

</style>
</head>

<body>

<div class="stars"></div>

<!-- 🎵 PLAYER -->
<div class="music-player">
  <span>play this song</span>
  <audio controls autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>
</div>

<!-- 📖 CAPA -->
<section><img src="capa.png"></section>
<section><img src="pagina2.png"></section>
<section><img src="pagina3.png"></section>
<section><img src="pagina4.png"></section>

<script>
const images = document.querySelectorAll("img");

function reveal(){
  const trigger = window.innerHeight * 0.85;

  images.forEach(img => {
    const top = img.getBoundingClientRect().top;

    if(top < trigger){
      img.classList.add("show");
    }
  });
}

window.addEventListener("scroll", reveal);
reveal();
</script>

</body>
</html>
