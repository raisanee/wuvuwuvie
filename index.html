<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To My Favorite Person</title>

<style>

body{
margin:0;
background:#0b0b14;
font-family:Georgia, serif;
color:white;
overflow-x:hidden;
}

section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:40px;
text-align:center;
}

img{
max-width:90%;
border-radius:12px;
box-shadow:0 0 30px rgba(255,255,255,0.15);
opacity:0;
transform:translateY(40px);
animation:fadeUp 1.2s forwards;
}

@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}

/* estrelinhas simples */
.stars{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(white 1px, transparent 1px);
background-size:50px 50px;
opacity:0.08;
pointer-events:none;
}

audio{
margin-top:20px;
}

</style>
</head>

<body>

<div class="stars"></div>

<section>
<img src="capa.png">
</section>

<section>
<img src="pagina2.png">
</section>

<section>
<img src="pagina3.png">

<audio controls autoplay loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>

</section>

<section>
<img src="pagina4.png">
</section>

</body>
</html>
