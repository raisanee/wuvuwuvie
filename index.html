<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To My Favorite Person</title>

<style>

body{
margin:0;
background:#0b0b14;
font-family:Georgia, serif;
color:white;
overflow-x:hidden;
}

/* 🌙 estrelas */
.stars{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(white 1px, transparent 1px);
background-size:50px 50px;
opacity:0.08;
pointer-events:none;
}

/* 🎵 música */
.music-player{
position:fixed;
top:12px;
left:12px;
z-index:999;

display:flex;
align-items:center;
gap:8px;

padding:8px 12px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter: blur(8px);

font-size:12px;
}

/* 📖 páginas */
section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:40px;
text-align:center;
}

/* ✨ animação simples que SEMPRE funciona */
img{
max-width:90%;
border-radius:12px;
box-shadow:0 0 30px rgba(255,255,255,0.15);

opacity:0;
animation:fadeIn 1.2s forwards;
}

/* delay manual por página */
section:nth-of-type(1) img{ animation-delay:0.2s; }
section:nth-of-type(2) img{ animation-delay:0.5s; }
section:nth-of-type(3) img{ animation-delay:0.8s; }
section:nth-of-type(4) img{ animation-delay:1.1s; }

@keyframes fadeIn{
to{
opacity:1;
}
}

img:hover{
transform:scale(1.02);
transition:0.3s;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="music-player">
  🎵 Our song
  <audio controls autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>
</div>

<section><img src="capa.png"></section>
<section><img src="pagina2.png"></section>
<section><img src="pagina3.png"></section>
<section><img src="pagina4.png"></section>

</body>
</html>
