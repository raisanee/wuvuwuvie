<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To My Favorite Person</title>

<style>

body{
margin:0;
background:#0b0b14;
font-family:Georgia, serif;
color:white;
overflow-x:hidden;
}

/* 🌌 ESTRELAS DE FUNDO (MELHORADAS) */
.stars{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:0;
}

/* ⭐ estrela bonita */
.star{
position:absolute;
width:6px;
height:6px;
background:white;
opacity:0.6;

/* formato de estrela (cruz + brilho) */
clip-path: polygon(
50% 0%,
61% 35%,
98% 35%,
68% 57%,
79% 91%,
50% 70%,
21% 91%,
32% 57%,
2% 35%,
39% 35%
);

animation: fall linear infinite, twinkle 2.5s ease-in-out infinite;
filter: drop-shadow(0 0 6px white);
}

/* 🌠 cair devagar */
@keyframes fall{
to{
transform: translateY(120vh);
opacity: 0;
}
}

/* ✨ piscar */
@keyframes twinkle{
0%,100%{opacity:0.2; transform:scale(0.8);}
50%{opacity:1; transform:scale(1.2);}
}

/* 🎵 player menor e mais delicado */
.music-player{
position:fixed;
top:10px;
left:10px;
z-index:999;

display:flex;
align-items:center;
gap:6px;

padding:6px 10px;
border-radius:16px;

background:rgba(255,255,255,0.08);
backdrop-filter: blur(8px);

font-size:11px;
color:white;
}

.music-player span{
opacity:0.8;
font-style:italic;
}

.music-player audio{
height:24px;
width:110px;
}

/* 📖 páginas */
section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* 🖼 imagens */
img{
max-width:90%;
border-radius:12px;
box-shadow:0 0 30px rgba(255,255,255,0.15);

opacity:0;
transform:translateY(50px);
transition:all 1s ease;
}

/* aparece no scroll */
img.show{
opacity:1;
transform:translateY(0);
}

</style>
</head>

<body>

<div class="stars"></div>

<!-- 🎵 PLAYER -->
<div class="music-player">
  <span>play this song</span>
  <audio controls autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>
</div>

<!-- 📖 CAPA -->
<section><img src="capa.png"></section>
<section><img src="pagina2.png"></section>
<section><img src="pagina3.png"></section>
<section><img src="pagina4.png"></section>

<script>

const images = document.querySelectorAll("img");

function reveal(){
  const trigger = window.innerHeight * 0.85;

  images.forEach(img => {
    const top = img.getBoundingClientRect().top;

    if(top < trigger){
      img.classList.add("show");
    }
  });
}

window.addEventListener("scroll", reveal);
reveal();

/* ⭐ gerar estrelas */
const container = document.querySelector(".stars");

for(let i = 0; i < 25; i++){
  const star = document.createElement("div");
  star.classList.add("star");

  star.style.left = Math.random() * 100 + "vw";
  star.style.top = -Math.random() * 100 + "vh";

  const size = 4 + Math.random() * 6;
  star.style.width = size + "px";
  star.style.height = size + "px";

  star.style.animationDuration = (8 + Math.random() * 10) + "s";
  star.style.animationDelay = Math.random() * 5 + "s";

  container.appendChild(star);
}

</script>

</body>
</html>
