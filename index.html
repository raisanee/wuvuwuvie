<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To My Favorite Person</title>

<style>

body{
margin:0;
background:#0b0b14;
font-family:Georgia, serif;
color:white;
overflow-x:hidden;
}

/* 🌙 fundo de estrelas */
.stars{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(white 1px, transparent 1px);
background-size:50px 50px;
opacity:0.08;
pointer-events:none;
z-index:0;
}

/* 🎵 música no topo */
.music-player{
position:fixed;
top:12px;
left:12px;
z-index:999;

display:flex;
align-items:center;
gap:8px;

padding:8px 12px;
border-radius:20px;

background:rgba(255,255,255,0.08);
backdrop-filter: blur(8px);

color:white;
font-size:12px;

box-shadow:0 0 20px rgba(255,255,255,0.1);
}

.music-player span{
opacity:0.8;
}

.music-player audio{
height:25px;
width:140px;
}

/* 📖 páginas */
section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:40px;
text-align:center;

opacity:0;
transform:translateY(40px);
animation:fadeIn 1s forwards;
z-index:1;
}

section:nth-child(2){ animation-delay:0s; }
section:nth-child(3){ animation-delay:0.3s; }
section:nth-child(4){ animation-delay:0.6s; }
section:nth-child(5){ animation-delay:0.9s; }

@keyframes fadeIn{
to{
opacity:1;
transform:translateY(0);
}
}

/* 🖼 imagens */
img{
max-width:90%;
border-radius:12px;
box-shadow:0 0 30px rgba(255,255,255,0.15);
}

/* ✨ leve brilho ao passar o mouse */
img:hover{
transform:scale(1.01);
transition:0.3s;
}

</style>
</head>

<body>

<div class="stars"></div>

<!-- 🎵 PLAYER FIXO -->
<div class="music-player">
  <span>🎵 Our song</span>
  <audio controls autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>
</div>

<!-- 📖 CAPA -->
<section>
  <img src="capa.png">
</section>

<!-- 📖 PÁGINA 2 -->
<section>
  <img src="pagina2.png">
</section>

<!-- 📖 PÁGINA 3 -->
<section>
  <img src="pagina3.png">
</section>

<!-- 📖 PÁGINA 4 -->
<section>
  <img src="pagina4.png">
</section>

</body>
</html>
