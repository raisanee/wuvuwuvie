<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To My Favorite Person</title>

<style>

body{
margin:0;
background:#0b0b14;
font-family:Georgia, serif;
color:white;
overflow-x:hidden;
}

/* 🌙 estrelas */
.stars{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(white 1px, transparent 1px);
background-size:50px 50px;
opacity:0.08;
pointer-events:none;
z-index:0;
}

/* 🎵 player */
.music-player{
position:fixed;
top:12px;
left:12px;
z-index:999;

display:flex;
align-items:center;
gap:8px;

padding:8px 12px;
border-radius:20px;

background:rgba(255,255,255,0.08);
backdrop-filter: blur(8px);

color:white;
font-size:12px;
}

.music-player audio{
height:25px;
width:140px;
}

/* 📖 páginas */
section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:40px;
text-align:center;

opacity:0;
transform:translateY(60px);
transition:all 1s ease;
}

/* quando aparece na tela */
section.show{
opacity:1;
transform:translateY(0);
}

/* 🖼 imagens */
img{
max-width:90%;
border-radius:12px;
box-shadow:0 0 30px rgba(255,255,255,0.15);
transition:0.4s;
}

img:hover{
transform:scale(1.02);
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="music-player">
  <span>🎵 Our song</span>
  <audio controls autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>
</div>

<section>
  <img src="capa.png">
</section>

<section>
  <img src="pagina2.png">
</section>

<section>
  <img src="pagina3.png">
</section>

<section>
  <img src="pagina4.png">
</section>

<script>
const sections = document.querySelectorAll("section");

function showOnScroll(){
  const trigger = window.innerHeight * 0.85;

  sections.forEach(sec => {
    const top = sec.getBoundingClientRect().top;

    if(top < trigger){
      sec.classList.add("show");
    }
  });
}

window.addEventListener("scroll", showOnScroll);
showOnScroll();
</script>

</body>
</html>
