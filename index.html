<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To My Favorite Person</title>

<style>

body{
margin:0;
background:#0b0b14;
font-family:Georgia, serif;
color:white;
overflow-x:hidden;
}

/* 🌙 estrelas */
.stars{
position:fixed;
width:100%;
height:100%;
background:radial-gradient(white 1px, transparent 1px);
background-size:50px 50px;
opacity:0.08;
pointer-events:none;
}

/* 🎵 player */
.music-player{
position:fixed;
top:12px;
left:12px;
z-index:999;

padding:10px 14px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter: blur(8px);

font-size:12px;
}

/* 📖 páginas */
section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* 🖼 imagens começam invisíveis */
img{
max-width:90%;
border-radius:12px;
box-shadow:0 0 30px rgba(255,255,255,0.15);

opacity:0;
transform:translateY(50px);
transition:all 1s ease;
}

/* quando ativar */
img.show{
opacity:1;
transform:translateY(0);
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="music-player">
🎵 Our song
<audio controls autoplay loop>
<source src="musica.mp3" type="audio/mpeg">
</audio>
</div>

<section><img src="capa.png"></section>
<section><img src="pagina2.png"></section>
<section><img src="pagina3.png"></section>
<section><img src="pagina4.png"></section>

<script>
const images = document.querySelectorAll("img");

function reveal(){
  const trigger = window.innerHeight * 0.85;

  images.forEach(img => {
    const top = img.getBoundingClientRect().top;

    if(top < trigger){
      img.classList.add("show");
    }
  });
}

window.addEventListener("scroll", reveal);
reveal();
</script>

</body>
</html>
