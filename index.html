<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To My Favorite Person</title>

<style>

body{
margin:0;
font-family:Georgia, serif;
overflow-x:hidden;
}

/* 🌟 FUNDO BASE CREME (primeiras páginas) */
.creme{
background:linear-gradient(#f5efe6, #f3e9dd);
color:#222;
}

/* 🌑 ÚLTIMA PÁGINA PRETA */
.dark{
background:#05060a;
color:white;
}

/* 📖 páginas */
section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:40px;
text-align:center;
position:relative;
overflow:hidden;
}

/* 🖼 imagens */
img{
max-width:90%;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
opacity:0;
transform:translateY(40px);
transition:all 1s ease;
}

img.show{
opacity:1;
transform:translateY(0);
}

/* 🎵 player */
.music-player{
position:fixed;
top:10px;
left:10px;
z-index:999;
padding:6px 10px;
border-radius:16px;
background:rgba(255,255,255,0.2);
backdrop-filter: blur(8px);
font-size:11px;
}

/* ✨ BRILHOS SUAVES */
.sparkle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
opacity:0.4;
animation:blink 3s infinite ease-in-out;
}

@keyframes blink{
0%,100%{opacity:0;}
50%{opacity:0.6;}
}

/* ✈️ AVIÃO FLUTUANDO */
.plane{
position:absolute;
top:20%;
left:-100px;
width:60px;
opacity:0.7;
animation:fly 12s linear infinite;
}

@keyframes fly{
0%{transform:translateX(0) translateY(0);}
50%{transform:translateX(120vw) translateY(-20px);}
100%{transform:translateX(240vw) translateY(0);}
}

/* 🌙 LUA */
.moon{
position:absolute;
top:60px;
right:60px;
width:90px;
height:90px;
border-radius:50%;
background:#f5f3d7;
box-shadow:0 0 30px rgba(255,255,200,0.5);
animation:pulse 4s infinite ease-in-out;
}

@keyframes pulse{
0%,100%{transform:scale(1); opacity:0.8;}
50%{transform:scale(1.08); opacity:1;}
}

/* 🌠 ESTRELAS CAINDO */
.falling-star{
position:absolute;
top:-20px;
width:2px;
height:2px;
background:white;
opacity:0.6;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(120vh);
opacity:0;
}
}

</style>
</head>

<body>

<!-- 🎵 música -->
<div class="music-player">
  🎵 play this song
  <audio controls autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>
</div>

<!-- ✨ CAPA -->
<section class="creme">

<img src="capa.png">

<!-- aviãozinho -->
<img src="plane.png" class="plane">

</section>

<!-- ✨ PÁGINA 2 -->
<section class="creme">
<img src="pagina2.png">
</section>

<!-- ✨ PÁGINA 3 -->
<section class="creme">
<img src="pagina3.png">
</section>

<!-- 🌑 ÚLTIMA PÁGINA -->
<section class="dark">

<div class="moon"></div>

<img src="pagina4.png">

</section>

<script>

/* ✨ revelar imagens */
const images = document.querySelectorAll("img");

function reveal(){
  const trigger = window.innerHeight * 0.85;

  images.forEach(img=>{
    const top = img.getBoundingClientRect().top;
    if(top < trigger){
      img.classList.add("show");
    }
  });
}

window.addEventListener("scroll", reveal);
reveal();

/* ✨ criar brilhos nas páginas claras */
const creamSections = document.querySelectorAll(".creme");

creamSections.forEach(sec=>{
  for(let i=0;i<20;i++){
    let s=document.createElement("div");
    s.classList.add("sparkle");
    s.style.top=Math.random()*100+"%";
    s.style.left=Math.random()*100+"%";
    s.style.animationDuration=(2+Math.random()*3)+"s";
    sec.appendChild(s);
  }
});

/* 🌠 estrelas caindo na última página */
const dark = document.querySelector(".dark");

for(let i=0;i<40;i++){
  let star=document.createElement("div");
  star.classList.add("falling-star");
  star.style.left=Math.random()*100+"%";
  star.style.animationDuration=(3+Math.random()*5)+"s";
  star.style.animationDelay=Math.random()*5+"s";
  dark.appendChild(star);
}

</script>

</body>
</html>
