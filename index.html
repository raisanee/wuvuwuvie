<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To My Favorite Person</title>

<style>

body{
margin:0;
background:#0b0b14;
font-family:Georgia, serif;
color:white;
overflow:hidden;
}

/* 💌 ENVELOPE SCREEN */
#envelope-screen{
position:fixed;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:radial-gradient(circle at center, #1a1a2e, #0b0b14);
z-index:999;
text-align:center;
cursor:pointer;
}

.envelope{
font-size:80px;
animation: float 2s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

#envelope-screen h1{
font-size:18px;
margin-top:20px;
opacity:0.85;
}

#envelope-screen p{
font-size:12px;
opacity:0.6;
}

/* 🌌 background stars */
.stars{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:0;
display:none;
}

.star{
position:absolute;
width:6px;
height:6px;
background:white;

clip-path: polygon(
50% 0%,
61% 35%,
98% 35%,
68% 57%,
79% 91%,
50% 70%,
21% 91%,
32% 57%,
2% 35%,
39% 35%
);

opacity:0.7;
filter: drop-shadow(0 0 6px white);
animation: fall linear infinite, twinkle 2.5s ease-in-out infinite;
}

@keyframes fall{
to{transform: translateY(120vh); opacity:0;}
}

@keyframes twinkle{
0%,100%{opacity:0.2; transform:scale(0.8);}
50%{opacity:1; transform:scale(1.2);}
}

/* 🎵 music player */
.music-player{
position:fixed;
top:10px;
left:10px;
z-index:10;
display:none;
padding:6px 10px;
border-radius:16px;
background:rgba(255,255,255,0.08);
backdrop-filter: blur(8px);
font-size:11px;
color:white;
}

/* 📖 scrapbook */
#content{
display:none;
}

/* pages */
section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:80px 20px;
box-sizing:border-box;
}

/* images */
img{
max-width:90%;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
opacity:0;
transform:translateY(40px);
transition:1s ease;
position:relative;
z-index:2;
}

img.show{
opacity:1;
transform:translateY(0);
}

</style>
</head>

<body>

<!-- 💌 ENVELOPE -->
<div id="envelope-screen">
  <div class="envelope">✉️</div>
  <h1>You received something</h1>
  <p>Open when you're ready</p>
</div>

<!-- 🌌 stars -->
<div class="stars"></div>

<!-- 🎵 music -->
<div class="music-player">
  🎵 play this song
  <audio controls loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>
</div>

<!-- 📖 CONTENT -->
<div id="content">

<section><img src="capa.png"></section>
<section><img src="pagina2.png"></section>
<section><img src="pagina3.png"></section>
<section><img src="pagina4.png"></section>

</div>

<script>

/* open envelope */
document.getElementById("envelope-screen").addEventListener("click", function(){

  this.style.opacity = "0";

  setTimeout(()=>{
    this.style.display = "none";
  }, 800);

  document.getElementById("content").style.display = "block";
  document.querySelector(".music-player").style.display = "flex";
  document.querySelector(".stars").style.display = "block";

});

/* scroll reveal */
const images = document.querySelectorAll("img");

function reveal(){
  const trigger = window.innerHeight * 0.85;

  images.forEach(img=>{
    if(img.getBoundingClientRect().top < trigger){
      img.classList.add("show");
    }
  });
}

window.addEventListener("scroll", reveal);

/* stars */
const container = document.querySelector(".stars");

for(let i=0;i<40;i++){
  const star = document.createElement("div");
  star.classList.add("star");

  star.style.left = Math.random()*100 + "vw";
  star.style.top = -Math.random()*100 + "vh";

  const size = 4 + Math.random()*6;
  star.style.width = size + "px";
  star.style.height = size + "px";

  star.style.animationDuration = (8 + Math.random()*10) + "s";

  container.appendChild(star);
}

</script>

</body>
</html>
